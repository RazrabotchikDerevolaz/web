<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Инди-игры</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- Оставляем теги пустыми, сюда загрузится контент -->
    <header id="site-header">
    
         <div class="header-images-container">
             <a href="https://t.me" target="_blank" class="header-link">
                 <img src="image/image1.jpg" alt="Фото 1" class="round-img">

             <a href="https://github.com" target="_blank" class="header-link">
                 <img src="image/image2.jpg" alt="Фото 2" class="round-img">
             </a>
         </div>
    
    </header>




    <main>
        <h1>Привет, мир!</h1>
        <p>Это пример простой, современной и адаптивной стартовой страницы.</p>
        <a href="#" class="btn">Узнать больше</a>
    </main>




    <footer id="site-footer">
    
      <div class="footer-social-container">
            <!-- Ссылка на первую соцсеть (например, Telegram) -->
            <a href="https://t.me" target="_blank" class="footer-img-link">
                <img src="image/image1.jpg" alt="Telegram" class="rounded-footer-img">
            </a>
    
            <!-- Ссылка на вторую соцсеть (например, ВКонтакте) -->
            <a href="https://vk.com" target="_blank" class="footer-img-link">
                <img src="image/image2.jpg" alt="ВКонтакте" class="rounded-footer-img">
            </a>

             <!-- Ссылка на вторую соцсеть (например, ВКонтакте) -->
            <a href="https://vk.com" target="_blank" class="footer-img-link">
                <img src="image/image2.jpg" alt="ВКонтакте" class="rounded-footer-img">
            </a>

             <!-- Ссылка на вторую соцсеть (например, ВКонтакте) -->
            <a href="https://vk.com" target="_blank" class="footer-img-link">
                <img src="image/image2.jpg" alt="ВКонтакте" class="rounded-footer-img">
            </a>

             <!-- Ссылка на вторую соцсеть (например, ВКонтакте) -->
            <a href="https://vk.com" target="_blank" class="footer-img-link">
                <img src="image/image2.jpg" alt="ВКонтакте" class="rounded-footer-img">
            </a>
      </div>  
          
    </footer>

    

    <!-- Скрипт, который автоматически соберет сайт воедино -->
    <script>
        // Функция для загрузки HTML-кода в нужный блок
        function loadComponent(elementId, filePath) {
            fetch(filePath)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(elementId).innerHTML = data;
                })
                .catch(error => console.error('Ошибка загрузки:', error));
        }

        // Запускаем загрузку файлов
        loadComponent('site-header', 'header.html');
        loadComponent('site-footer', 'footer.html');
    </script>
    

</body>
</html>
