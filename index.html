<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инди-игры</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- Оставляем теги пустыми, сюда загрузится контент -->
    <header id="site-header">    </header>




    <main>
        <h1>Привет, мир!ккккккккккккккккккккккккккккккккккк</h1>
        <p>Это пример простой, современной и адаптивной стартовой страницы.</p>
        <a href="#" class="btn">Узнать больше</a>
    </main>




    <footer id="site-footer">    </footer>



    <!-- Скрипт, который автоматически соберет сайт воедино -->
    <script>
        // Функция для загрузки HTML-кода в нужный блок
        function loadComponent(elementId, filePath) {
            fetch(filePath)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(elementId).innerHTML = data;
                })
                .catch(error => console.error('Ошибка загрузки:', error));
        }

        // Запускаем загрузку файлов
        loadComponent('site-header', 'header.html');
        loadComponent('site-footer', 'footer.html');
    </script>



</body>
</html>
